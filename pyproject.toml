# lucidlint — pyproject.toml
#
# CHANGE: bump requires-python with the current stable at scaffold time
# (`uv python list` — never guess).
#
# DO NOT CHANGE:
# - No `ignore = [...]` list in [tool.ruff.lint] — don't cargo-cult
#   chat-workflow/energy_envelope's UP046/UP047 skip (a reflection
#   constraint there, not a general practice).
# - Dev deps live in PEP 735 [dependency-groups] dev, never split across
#   optional-dependencies too.
# - Runtime deps stay MINIMAL: the scan core is the Rust binary shipped in
#   the wheel (setup.py builds it into lucidlint_bin/); libcst (the fix
#   engine's parser) is declared so a plain `pip install lucidlint` can fix —
#   the release bundle self-contains it instead (deps/ vendored).

[project]
name = "lucidlint"
version = "0.2.0"
description = "Deterministic lucidlint tooling: a Rust scan core under a thin Python orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["libcst>=1.9.0"]

[project.scripts]
# `pip install` gives a `lucidlint` command — no .py, no fix- prefixes
lucidlint = "lucidlint:main"

[project.optional-dependencies]
# git history + file listing; the orchestrator degrades to rglob/no-history
# when pygit2 is absent — genuinely optional, so it must not be a mandatory
# runtime dependency (a consuming repo would pay for libgit2 unused)
git = ["pygit2>=1.20.0"]
graph = ["code-review-graph>=2.3.7"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.0",
    "pyrefly>=1.2.0",
]

[build-system]
requires = ["setuptools>=64.0", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["lucidlint", "fix_engine", "rule_metadata"]

[tool.setuptools.packages.find]
include = ["lucidlint_bin*"]

[tool.setuptools.package-data]
lucidlint_bin = ["bin/*"]

[tool.ruff]
target-version = "py312"  # the RUNTIME FLOOR: houses invokes the tools on 3.12 (see README);
# .python-version (3.14) is the dev pin — ruff must not emit 3.14-only syntax
# (e.g. `except A, B:`) that would break the tool on the repos it scans.
line-length = 120
# tests/fixtures/ is intentionally non-compliant test input (standalone
# snippets without imports) — excluded from lint for that reason.
extend-exclude = ["tests/fixtures", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# No ignore list: don't cargo-cult chat-workflow/energy_envelope's UP046/UP047
# skip (a reflection constraint there, not a general practice).
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# the tool's own code is the subject — the fix-engine tests exec fixtures
# under synthetic filenames ("after.py", "app.py"...) that coverage cannot
# measure at report time; scoping the source set keeps them out entirely
# the shipped Python is the subject (lucidlint.py + the fix engine);
# rule_metadata.py feeds RULES.md generation and scripts/ is dev tooling —
# neither ships, so neither is measured
source = ["lucidlint", "fix_engine"]
omit = ["*/__main__.py"]

[tool.pyrefly]
preset = "default"
errors = { missing-override-decorator = true, missing-super-call = true }
