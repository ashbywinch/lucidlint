[package]
name = "lucidlint"
version = "0.1.0"
edition = "2021"
description = "Rust scan core for the deterministic lucidlint gate — ruff parser, parity-gated against the Python implementation"

[dependencies]
rayon = "1.10"
# PINNED: ruff's internal crates are versioned 0.0.x and move fast; the parity
# gate depends on the parser semantics staying fixed. Bump deliberately.
ruff_python_parser = "=0.0.9"
ruff_python_ast = "=0.0.9"
ruff_text_size = "=0.0.9"

radonc = { path = "radonc" }
# PINNED-ish: syn 2.x is the stable external Rust AST (parse_file + visit);
# bump deliberately (the rust scan layer is written against its shapes)
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
# span-locations enables Span::start()/end() -> LineColumn (1-based lines)
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the repo config (.lucidlint.toml / [tool.lucidlint]) — the LSP applies the
# same silencing rules as the gate
toml = "0.8"

[profile.release]
lto = true
