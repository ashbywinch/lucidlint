# PR-Agent config — the house review contract.
#
# CHANGE: repo_context_files tracks the repo's doc set.
#
# DO NOT CHANGE:
# - api_base points at the house provider. Never let a PR branch override
#   it (the workflow has no checkout for exactly this reason).
# - model stays "openai/dynamic/fallback2": the action's handler strips the
#   openai/ (and azure/) prefix and sends the bare name to api_base — the
#   Cloudflare AI Gateway resolves "dynamic/fallback2" via its dynamic
#   fallback (OpenCode -> DeepSeek). Any OTHER prefix goes to the endpoint
#   verbatim and 401s with "Model ... is not supported" — silently, every run.
# - This file applies ONLY when the workflow pins PR_AGENT_CONFIG_BRANCH to
#   a branch holding it: the action gates repo .pr_agent.toml keys by
#   per-host allowed-keys, so without the pin the image defaults run
#   (model gpt-5.6, api_base api.openai.com) and the key is rejected as
#   "Incorrect API key provided: sk-...".
# - repo_context_files lists ALL the standards + plan docs: the reviewer
#   reads ONLY these files, so a rule that isn't listed here is invisible
#   to review.
# - extra_instructions demands a per-doc Compliance section — this is what
#   makes the bot enforce the standards instead of rubber-stamping.

[openai]
custom_llm_provider = "openai"
api_base = "https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat"

[config]
model = "openai/dynamic/fallback2"
custom_model_max_tokens = 128000
max_model_tokens = 128000
ai_timeout = 1800  # reviews on large diffs take minutes; the upstream default is too low
fallback_models = []
# DeepSeek V4 is a reasoning model, and with thinking on it returns
# reasoning-only responses for large review prompts: measured 2026-10-19,
# two calls (2h19m / 101,965 output tokens; 25m / 25,333) came back with
# finish_reason length/stop and content NULL — pr-agent raised
# EmptyTruncatedResponseError and posted no review at all. The fix is the
# knob upstream added for exactly this (PR #3460): turn thinking off for the
# review call. Measured elsewhere on the same model: no reasoning_effort →
# 1,309 reasoning tokens; "none" → 0 reasoning tokens, content produced
# (pr-agent issue #3459), and with thinking disabled 12/12 requests returned
# non-empty content (vLLM #52640). OpenRouter accepts reasoning_effort as an
# OpenAI-style enum including "none".
#
# The second key is the gate: reasoning_effort is only forwarded for model ids
# in the built-in list, so our gateway route id has to opt in. Matching is by
# suffix, so the bare route name works (the handler sees
# "openai/dynamic/fallback2"). Needs the action pin at v0.48.0+.
reasoning_effort = "none"
additional_reasoning_effort_models = ["dynamic/fallback2"]
repo_context_from_default_branch = false
repo_context_files = [
    "docs/PRD.md",
    "docs/TECHSPEC.md",
    "docs/PLAN.md",
    "docs/coding-standards.md",
    "docs/testing-standards.md",
    "docs/ux-standards.md",
    "docs/writing-documentation.md",
    "docs/documentation-structure.md",
]

[litellm]
# Cloudflare AI Gateway request options — same transport as omp-config:
# long timeout for large reviews, no gateway-side retries (a push re-runs
# the review), exponential backoff, and per-request metadata for analytics.
extra_headers = '{"cf-aig-request-timeout": "1800000", "cf-aig-max-attempts": "0", "cf-aig-backoff": "exponential", "cf-aig-metadata": "{\"source\":\"review\",\"repo\":\"lucidlint\"}"}'

[pr_reviewer]
# Incremental reviews must post FRESH comments: the commit range anchors on
# the previous review comment's created_at (github_provider.get_commit_range),
# which an in-place-updated persistent comment would break (2026-08-11).
persistent_comment = false
require_tests_review = true
require_security_review = true
# 10, not 50 (2026-10-19): the cap is the review's OUTPUT demand. At 50 —
# with nine per-doc Compliance sections — the model ran to its output ceiling
# and returned nothing: a 2h46m call, 131,704 output tokens, finish_reason
# length, content null → EmptyTruncatedResponseError, the action failed, no
# review posted. The neighbour with the same gateway, route, token caps and
# Compliance instruction is houses at 10 → 1.3–2.0 min reviews, 4/4 green;
# omp-config at 50 is the fleet's slowest and flakiest (6–32 min, half
# failing). Same class as 6bb1b57 (runaway generations fail the gate).
num_max_findings = 10
extra_instructions = "Check the PR against each file in repo_context_files. Add a 'Compliance' section per doc, listing any violations found or 'No violations'. Flag violations as findings, not just notes: requirement deviations from docs/PRD.md (a change that violates a stated requirement, constraint, persona, or JTBD is a finding), tech-spec deviations from docs/TECHSPEC.md (architecture, object model, decisions), and plan deviations from docs/PLAN.md (phases, quality gates). Structural findings the standards name are findings too: a missed class (bare dict/tuple/list in a record position), a name that violates the object model or domain-noun rules, and separation-of-concerns violations."

[pr_code_suggestions]
persistent_comment = true

[github_action_config]
handle_push_trigger = true
# -i on /review is the ONLY incremental enabler in v0.41.1 (the
# enable_incremental config key does not exist in this version) — without
# it every push re-reviews the WHOLE PR diff (family-history-album 2026-08):
# the incremental flag makes each push review only the commits since the
# previous review, so a 12-push PR costs 12 small reviews, not 12 full ones.
# /improve (code suggestions) is dropped: its runaway generations (285K
# output tokens on a 9.3K prompt, 2026-10-04) come back empty at the token
# ceiling, and the fail-loud wrapper fails the whole action on that recorded
# tool error — the review itself had posted clean. The review is what the
# gate exists for; the suggestions pass was never a requirement.
push_commands = ["/review -i"]
# The omp harness pushes through its GitHub App token, so the synchronize
# event's sender is a Bot — with the upstream default (ignore_bot_commits)
# the review is skipped on every agent push and the fail-loud check-review
# step fails the PR. The agent's commits ARE the developer's work here;
# review them. (Dependabot PRs are already excluded at the job level.)
push_trigger_ignore_bot_commits = false
# A human posting "/skip" on the PR skips the AI review for that PR
# (the check-review step passes on it). Deliberate opt-out only — the
# default is that every PR gets reviewed. Do NOT use /skip on your own
# initiative; only when the user explicitly asks.
skip_commands = ["/skip"]
