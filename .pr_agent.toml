# PR-Agent — the house review contract. The workflow reads this file from the
# pr-agent-config branch; a PR branch must never override it.
#
# CHANGE: repo_context_files tracks the repo's doc set; keep the budget above
# the list's line count.
#
# DO NOT CHANGE:
# - api_base/model: the gateway resolves the bare "dynamic/fallback2" route;
#   any other prefix 401s.
# - The workflow's PR_AGENT_CONFIG_BRANCH pin: without it the image defaults
#   run and the key is rejected.
# - repo_context_files is the reviewer's whole world: an unlisted file is
#   invisible to review.
# - extra_instructions demands a per-doc Compliance section.

[openai]
custom_llm_provider = "openai"
api_base = "https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat"

[config]
model = "openai/dynamic/fallback2"
custom_model_max_tokens = 128000
max_model_tokens = 128000
ai_timeout = 1800  # large diffs take minutes; the upstream default is too low
fallback_models = []
# Turn thinking off for the gateway route (needs the v0.48+ action pin).
reasoning_effort = "none"
additional_reasoning_effort_models = ["dynamic/fallback2"]
# Do not re-post identical inline comments across pushes.
persistent_inline_comments = true

repo_context_from_default_branch = false
# The nine files are ~1750 lines; the 500-line default truncates and silently
# drops every later file. Keep this above the list's total.
repo_context_max_lines = 1900
repo_context_files = [
    "docs/PRD.md",
    "docs/TECHSPEC.md",
    "docs/PLAN.md",
    "docs/coding-standards.md",
    "docs/testing-standards.md",
    "docs/ux-standards.md",
    "docs/writing-documentation.md",
    "docs/writing-messages.md",
    "docs/documentation-structure.md",
]

[litellm]
# Cloudflare AI Gateway transport: long timeout, no gateway retries (a push
# re-runs the review), exponential backoff, request metadata for analytics.
extra_headers = '{"cf-aig-request-timeout": "1800000", "cf-aig-max-attempts": "0", "cf-aig-backoff": "exponential", "cf-aig-metadata": "{\"source\":\"review\",\"repo\":\"lucidlint\"}"}'

[pr_reviewer]
# Incremental reviews anchor on the previous review comment's time; keep this
# false or every push re-reviews the whole PR.
persistent_comment = false
require_tests_review = true
require_security_review = true
# Bound the review's output demand; a high cap returns empty content.
num_max_findings = 10
# Findings post as inline comments; unanchorable findings stay in the summary.
inline_key_issues = true
extra_instructions = "Check the PR against each file in repo_context_files. Add a 'Compliance' section per doc, listing any violations found or 'No violations'. Flag violations as findings, not just notes: requirement deviations from docs/PRD.md (a change that violates a stated requirement, constraint, persona, or JTBD is a finding), tech-spec deviations from docs/TECHSPEC.md (architecture, object model, decisions), and plan deviations from docs/PLAN.md (phases, quality gates). Structural findings the standards name are findings too: a missed class (bare dict/tuple/list in a record position), a name that violates the object model or domain-noun rules, and separation-of-concerns violations."

[github_action_config]
handle_push_trigger = true
# Code suggestions are off; the review is the gate.
auto_improve = false
# -i is the only incremental switch; without it every push reviews the whole diff.
push_commands = ["/review -i"]
# The harness pushes as a bot; review those pushes.
push_trigger_ignore_bot_commits = false
# Human opt-out only; never use it on your own initiative.
skip_commands = ["/skip"]
