# CI — delegates to make, never raw tool commands.
#
# DO NOT CHANGE:
# - `permissions: contents: read` (+ `pull-requests: write` only while the
#   coverage-comment step is present — drop both together if you drop it).
# - The concurrency group: every active repo uses cancel-in-progress.
# - Steps are exactly make targets. Never inline pip/uv logic into the
#   workflow — CI and local dev must run the same recipes.
# - Lint runs via `make lint-github` so findings surface as PR annotations.

name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write   # the coverage comment step needs it; drop if you drop that step
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable   # reads scanner/rust-toolchain.toml — the CI+local pin
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: make setup
      - run: make lint-github
      - run: make test
      - run: make self-check
      - run: make coverage
      - name: Coverage summary (Python)
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          thresholds: '80 90'  # measured 86% (scoped to the shipped Python) — floor below, goal above
          format: markdown
          output: both
      - name: Coverage summary (Rust)
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage-rust.xml
          badge: true
          fail_below_min: true
          thresholds: '60 70'  # measured 65.6% — floor below the measured number, raise it as it lands
          format: markdown
          output: both
      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

  # The two distribution channels must stay self-contained: the pip wheel
  # (Rust core built INTO it by setup.py) and the Rust-native cargo install.
  # Each installs into a clean environment and exercises the real surface.
  verify-pip-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: make setup
      - run: make wheel-check

  verify-cargo-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: make setup
      - run: make cargo-install-check
