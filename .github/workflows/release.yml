# Release — build the lucidlint bundles on a version tag and publish them.
#
# DO NOT CHANGE:
# - The matrix targets: linux gnu (glibc — the DEFAULT linux bundle, ships
#   the vendored libcst so released fixes work out of the box), linux musl
#   (static/Alpine hosts — no libcst by design, its fix path reports the
#   requirement, asserted degraded in the post-packaging check), macos
#   arm64 + x64, windows x64 — the five platform bundles every consumer
#   downloads.
#
# - The post-packaging checks: BEFORE upload, every artifact is exercised
#   through scan -> fix -> re-scan PASS (scripts/deploy-check.py) — the
#   bundle's fix path runs the vendored deps/ libcst (the v0.5.0 regression:
#   the linux bundle shipped without it and released fixes broke), the wheel
#   installs into a clean venv, the sdist builds its Rust core at install.
#   The musl bundle's degraded fix path (reports the requirement) is
#   asserted too. Never skip these without a replacement gate.
# - CODE_HEALTH_VERSION: the tag IS the version; the binary is stamped at
#   build time so `lucidlint --version` matches the bundle it ships in.
# - The bundle layout: <prefix>/bin/lucidlint + lucidlint.py next to it and
#   every shipped module — the orchestrator resolves its sibling binary, so
#   the bundle is self-contained (no PATH, no env).
# - The pip package: every runner also ships its platform wheel (host-target
#   Rust core — the bundle cross-build above stays separate), the linux
#   runner adds the platform-independent sdist. Both attach to the release
#   page so consumers can download and `pip install <file>` locally — no
#   registry involved. (The bundle step's CODE_HEALTH_VERSION env is
#   repeated on the wheel build: option_env! is compile-time and cargo
#   caches by source, so a cache-hit wheel reuses the stamped binary, and a
#   fresh host build stamps the same tag.)
#
# Trigger: a tag push (v*) publishes the bundles; the build job ALSO runs on
# every pull_request — the protect-main ruleset requires the build (...) 
# checks, and running the full release pipeline on a PR catches release
# breakage before the tag. The release job (publishing) stays tag-only.
# On PR runs CODE_HEALTH_VERSION is empty, so the binary reports the crate
# version instead of the branch ref; the bundle dir names use "dev".
# The version cadence is 0.x toward the full release; each capability
# (fleet wiring, the library split) bumps the minor.

name: release
on:
  push:
    tags: ["v*"]
  pull_request:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable   # reads scanner/rust-toolchain.toml — the CI+local pin
      - if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Build the binary (version-stamped)
        working-directory: scanner
        run: cargo build --release --manifest-path Cargo.toml --target ${{ matrix.target }}
        env:
          CODE_HEALTH_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - name: Assemble the bundle
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}"
          target="${{ matrix.target }}"
          exe=""
          if [ "$target" = "x86_64-pc-windows-msvc" ]; then exe=".exe"; fi
          dir="lucidlint-${ver}-${target}"
          mkdir -p "dist/${dir}/bin"
          cp "scanner/target/${target}/release/lucidlint${exe}" "dist/${dir}/bin/lucidlint${exe}"
          cp lucidlint.py "dist/${dir}/"
          cp rule_metadata.py "dist/${dir}/"
          cp fix_engine.py "dist/${dir}/"
          cp release/Makefile "dist/${dir}/Makefile"
          printf '%s\n' "$ver" > "dist/${dir}/version.txt"
          # self-contain the fix engine's libcst in deps/ so the fix path
          # works from the bundle with no pip step (review-log B8). lucidlint.py
          # prepends this sibling deps/ to sys.path when present. libcst >= 1.0
          # has NO pure-Python parser — the compiled libcst.native extension is
          # ABI-locked to the CPython/glibc that built it, so a runner-built
          # wheel only imports under the SAME ABI. The x86_64-musl bundle serves
          # static/Alpine hosts where a glibc libcst cannot load — it keeps no
          # deps/ and the fix path reports its requirement there.
          if [ "$target" != "x86_64-unknown-linux-musl" ]; then
            python3 -m pip install --quiet --target "dist/${dir}/deps" "libcst>=1.9.0"
          fi
          tar -C dist -czf "dist/${dir}.tar.gz" "${dir}"
      - name: Post-packaging check — the bundle (imports resolve, gate runs, consumer flow)
        shell: bash
        run: |
          set -euo pipefail
          dir="lucidlint-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}-${{ matrix.target }}"
          python3 "dist/${dir}/lucidlint.py" --version
          python3 "dist/${dir}/lucidlint.py" --repo .
          # the documented consumer flow — `make -C <bundle> lucidlint` —
          # must work from the tarball layout (bundle Makefile present).
          # Guarded to the non-windows rows: the windows runner has no `make`.
          if [ "${{ matrix.target }}" != "x86_64-pc-windows-msvc" ]; then
            make -C "dist/${dir}" lucidlint REPO="$GITHUB_WORKSPACE" BASELINE=
          fi
      - name: Post-packaging check — the bundle's fix path works end to end
        # The regression gate for the v0.5.0 bug: the shipped linux bundle
        # never carried the vendored libcst, so released fixes reported
        # "requires libcst" and did nothing. deploy-check drives the
        # PACKAGED lucidlint.py through scan -> fix -> re-scan PASS — a
        # missing module or a deps/ libcst that fails to import fails this
        # step loudly.
        if: matrix.target != 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          dir="lucidlint-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}-${{ matrix.target }}"
          # absolute bundle path: deploy-check runs the command with the
          # project dir as cwd, so a checkout-relative path would resolve
          # inside the project and fail with non-JSON output. The windows
          # runner's GITHUB_WORKSPACE uses backslashes, which shlex treats
          # as escapes (D:\a\... glues to D:alucidlint...) - normalize to
          # forward slashes before the value reaches shlex.
          bundle="${GITHUB_WORKSPACE//\\//}/dist/${dir}/lucidlint.py"
          python3 scripts/deploy-check.py --lucidlint "python3 ${bundle}" --project "${RUNNER_TEMP}/bundle-check"
      - name: Post-packaging check — musl bundle degrades honestly (no libcst by design)
        # The static bundle cannot load glibc-built libcst, so it ships
        # without deps/ and the fix path must REPORT its requirement — never
        # crash. This pins that documented contract to the artifact.
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          dir="lucidlint-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}-${{ matrix.target }}"
          set +e
          python3 "dist/${dir}/lucidlint.py" fix --kind extract-method --file lucidlint.py --line 1 > "${RUNNER_TEMP}/musl-fix.txt" 2>&1
          rc=$?
          set -e
          [ "$rc" -eq 1 ] || { echo "musl fix must exit 1, got $rc"; cat "${RUNNER_TEMP}/musl-fix.txt"; exit 1; }
          grep -q "requires libcst" "${RUNNER_TEMP}/musl-fix.txt"
      - uses: astral-sh/setup-uv@v5
      - name: Build the pip wheel (host-target Rust core)
        # The cross action on the musl row exports CARGO_BUILD_TARGET=...musl;
        # setup.py's build_py runs `cargo build --release` (host) and copies
        # target/release/lucidlint — the leaked default target would build the
        # musl target instead and the copy would fail. Unset it so the wheel
        # gets the genuine host binary. shell: bash — unset is a bash builtin
        # and the windows runner's default shell is PowerShell.
        shell: bash
        run: unset CARGO_BUILD_TARGET && uv build --wheel --out-dir pip-dist
        env:
          CODE_HEALTH_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          # widen the pip tag beyond the runner's OS: 11.0 is the arm64
          # floor (Rust's aarch64-apple-darwin minimum), 10.13 for x64
          MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.os, 'macos-14') && '11.0' || startsWith(matrix.os, 'macos-15') && '10.13' || '' }}
      - name: Post-packaging check — the pip wheel (clean-venv install, scan + fix)
        # What a real pip user gets: the freshly built wheel installed into a
        # CLEAN venv, driven through scan -> fix -> re-scan PASS. A wheel
        # whose libcst dependency was never declared, whose modules are
        # missing, or whose embedded binary is absent fails this step. The
        # release-built wheel is tested here (PR CI tests a different build).
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          python3 -m venv "${tmp}/venv"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then PY="${tmp}/venv/Scripts/python.exe"; else PY="${tmp}/venv/bin/python"; fi
          "${PY}" -m pip install --quiet pip-dist/*.whl
          "${PY}" -m lucidlint --version
          "${PY}" scripts/deploy-check.py --lucidlint "${PY} -m lucidlint" --project "${tmp}/project"
          rm -rf "${tmp}"
      - if: matrix.cross
        name: Build the source distribution
        run: uv build --sdist --out-dir pip-dist
      - if: matrix.cross
        name: Post-packaging check — the sdist (clean-venv install builds the Rust core)
        # The sdist is the platform-independent pip artifact: it compiles the
        # scanner at install time (cargo, present on this row). A MANIFEST
        # gap (a shipped module or scanner source missing from the sdist)
        # fails the install or the deploy-check that follows.
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_BUILD_TARGET  # the cross action leaks it; see the wheel step above
          tmp="$(mktemp -d)"
          python3 -m venv "${tmp}/venv"
          PY="${tmp}/venv/bin/python"
          "${PY}" -m pip install --quiet pip-dist/*.tar.gz
          "${PY}" scripts/deploy-check.py --lucidlint "${PY} -m lucidlint" --project "${tmp}/project"
          rm -rf "${tmp}"
      - uses: actions/upload-artifact@v4
        with:
          name: pip-${{ matrix.target }}
          path: pip-dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true
      - name: Checksums over every bundle
        run: |
          cd bundles
          python3 - <<'EOF'
          import hashlib, pathlib
          lines = []
          for p in sorted(pathlib.Path(".").glob("*.tar.gz")):
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          pathlib.Path("SHA256SUMS").write_text("\n".join(lines) + "\n")
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/*.tar.gz
            bundles/SHA256SUMS
            wheels/*.whl
            wheels/*.tar.gz
          generate_release_notes: true
