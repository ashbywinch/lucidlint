# Release — build the lucidlint bundles on a version tag and publish them.
#
# DO NOT CHANGE:
# - The matrix targets: linux musl (static), macos arm64 + x64, windows x64 —
#   the four platform bundles every consumer downloads.
# - CODE_HEALTH_VERSION: the tag IS the version; the binary is stamped at
#   build time so `lucidlint --version` matches the bundle it ships in.
# - The bundle layout: <prefix>/bin/lucidlint + lucidlint.py next to it —
#   the orchestrator resolves its sibling binary, so the bundle is
#   self-contained (no PATH, no env).
# - The pip package: every runner also ships its platform wheel (host-target
#   Rust core — the bundle cross-build above stays separate), the linux
#   runner adds the platform-independent sdist. Both attach to the release
#   page so consumers can download and `pip install <file>` locally — no
#   registry involved. (The bundle step's CODE_HEALTH_VERSION env is
#   repeated on the wheel build: option_env! is compile-time and cargo
#   caches by source, so a cache-hit wheel reuses the stamped binary, and a
#   fresh host build stamps the same tag.)
#
# Trigger: a tag push (v*) publishes the bundles; the build job ALSO runs on
# every pull_request — the protect-main ruleset requires the build (...) 
# checks, and running the full release pipeline on a PR catches release
# breakage before the tag. The release job (publishing) stays tag-only.
# On PR runs CODE_HEALTH_VERSION is empty, so the binary reports the crate
# version instead of the branch ref; the bundle dir names use "dev".
# The version cadence is 0.x toward the full release; each capability
# (fleet wiring, the library split) bumps the minor.

name: release
on:
  push:
    tags: ["v*"]
  pull_request:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable   # reads scanner/rust-toolchain.toml — the CI+local pin
      - if: matrix.cross
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - name: Build the binary (version-stamped)
        working-directory: scanner
        run: cargo build --release --manifest-path Cargo.toml --target ${{ matrix.target }}
        env:
          CODE_HEALTH_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - name: Assemble the bundle
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}"
          target="${{ matrix.target }}"
          exe=""
          if [ "$target" = "x86_64-pc-windows-msvc" ]; then exe=".exe"; fi
          dir="lucidlint-${ver}-${target}"
          mkdir -p "dist/${dir}/bin"
          cp "scanner/target/${target}/release/lucidlint${exe}" "dist/${dir}/bin/lucidlint${exe}"
          cp lucidlint.py "dist/${dir}/"
          cp fix_engine.py "dist/${dir}/"
          cp release/Makefile "dist/${dir}/Makefile"
          printf '%s\n' "$ver" > "dist/${dir}/version.txt"
          # self-contain the fix engine's libcst in deps/ so the fix path
          # works from the bundle with no pip step (review-log B8). lucidlint.py
          # prepends this sibling deps/ to sys.path when present. libcst >= 1.0
          # has NO pure-Python parser — the compiled libcst.native extension is
          # ABI-locked to the CPython/glibc that built it, so a runner-built
          # wheel only imports under the SAME ABI. The x86_64-musl bundle serves
          # static/Alpine hosts where a glibc libcst cannot load — it keeps no
          # deps/ and the fix path reports its requirement there.
          if [ "$target" != "x86_64-unknown-linux-musl" ]; then
            python3 -m pip install --quiet --target "dist/${dir}/deps" "libcst>=1.9.0"
          fi
          tar -C dist -czf "dist/${dir}.tar.gz" "${dir}"
      - name: Build the pip wheel (host-target Rust core)
        # The cross action on the musl row exports CARGO_BUILD_TARGET=...musl;
        # setup.py's build_py runs `cargo build --release` (host) and copies
        # target/release/lucidlint — the leaked default target would build the
        # musl target instead and the copy would fail. Unset it so the wheel
        # gets the genuine host binary.
        run: unset CARGO_BUILD_TARGET && uv build --wheel --out-dir pip-dist
        env:
          CODE_HEALTH_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          # widen the pip tag beyond the runner's OS: 11.0 is the arm64
          # floor (Rust's aarch64-apple-darwin minimum), 10.13 for x64
          MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.os, 'macos-14') && '11.0' || startsWith(matrix.os, 'macos-15') && '10.13' || '' }}
      - if: matrix.cross
        name: Build the source distribution
        run: uv build --sdist --out-dir pip-dist
      - uses: actions/upload-artifact@v4
        with:
          name: pip-${{ matrix.target }}
          path: pip-dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: wheels
          merge-multiple: true
      - name: Checksums over every bundle
        run: |
          cd bundles
          python3 - <<'EOF'
          import hashlib, pathlib
          lines = []
          for p in sorted(pathlib.Path(".").glob("*.tar.gz")):
              lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
          pathlib.Path("SHA256SUMS").write_text("\n".join(lines) + "\n")
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bundles/*.tar.gz
            bundles/SHA256SUMS
            wheels/*.whl
            wheels/*.tar.gz
          generate_release_notes: true
