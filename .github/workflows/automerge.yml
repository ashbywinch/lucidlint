name: Arm auto-merge

# GitHub's auto-merge is a per-PR flag, and nothing sets it automatically: the
# repo-level "allow auto-merge" setting only permits one to exist. This job arms
# it on every PR, so the `protect-main` ruleset's one approving review and
# required status checks are the only remaining gates; once they pass, the PR
# merges itself.
#
# It does not approve anything. It only sets the flag; the `protect-main`
# ruleset's required status checks are what hold the merge.
#
# Same-repo branches only: a fork PR has no write access to arm it, and should
# not merge itself anyway.
#
# Also clears the one other click: with `strict_required_status_checks_policy`,
# a PR whose branch is behind main cannot merge until it is updated. Update it
# here instead of asking for a button press.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # Arming once at open is not enough: GitHub can drop auto-merge, and a
  # dropped flag leaves the approval doing nothing. Re-arming on the review
  # itself means the approval always lands, whichever way the flag got lost.
  pull_request_review:
    types: [submitted]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write        # update-branch
  pull-requests: write   # enable auto-merge

jobs:
  arm:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Arm auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Idempotent: every push fires this, and an already-armed PR must not
          # fail the job. `--jq` prints an EMPTY line for a null field, not the
          # word null - comparing to "null" alone marks every PR as armed.
          armed=$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest')
          case "$armed" in
            "" | null) : ;;
            *)
              echo "auto-merge already armed"
              exit 0
              ;;
          esac
          # A branch behind main blocks the strict status check, so nothing
          # merges until it is updated. BEHIND means mergeable-but-stale.
          state=$(gh pr view "$PR" --repo "$REPO" --json mergeStateStatus --jq .mergeStateStatus)
          echo "merge state: $state"
          if [ "$state" = "BEHIND" ]; then
            if ! out=$(gh api -X PUT "repos/$REPO/pulls/$PR/update-branch" 2>&1); then
              echo "update-branch failed: $out" >&2
              exit 1
            fi
            echo "branch updated"
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --merge
